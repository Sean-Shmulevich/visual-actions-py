[project]
name = "visual-actions"
version = "0.1.0"
description = "Modal hand-gesture control for the desktop, Vim style"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-python>=4.10",
    "mediapipe>=0.10.14",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "platformdirs>=4.2",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
macos = [
    "pyobjc-framework-Quartz>=10.3",
    "pyobjc-framework-AVFoundation>=10.3",
    "pyobjc-framework-ApplicationServices>=10.3",
    "rumps>=0.4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["visual_actions"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
